<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jarvis Control Surface</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        margin: 0;
        background: radial-gradient(circle at top, #1f2a44, #0a0d16 60%);
        color: #f0f4ff;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        padding: 32px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 24px;
      }

      .orb {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle, #4dd4ff, #1a4d73);
        box-shadow: 0 0 20px rgba(77, 212, 255, 0.6);
        animation: pulse 3s infinite ease-in-out;
      }

      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          box-shadow: 0 0 16px rgba(77, 212, 255, 0.5);
        }
        50% {
          transform: scale(1.08);
          box-shadow: 0 0 28px rgba(77, 212, 255, 0.8);
        }
      }

      main {
        display: grid;
        gap: 24px;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      }

      .panel {
        background: rgba(15, 19, 32, 0.7);
        border-radius: 18px;
        padding: 20px;
        backdrop-filter: blur(12px);
        border: 1px solid rgba(77, 212, 255, 0.12);
        box-shadow: 0 20px 40px rgba(7, 10, 20, 0.4);
      }

      .panel h2 {
        margin-top: 0;
        font-size: 1.2rem;
        letter-spacing: 0.6px;
      }

      #transcript {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 320px;
        overflow-y: auto;
      }

      #transcript li {
        margin-bottom: 14px;
        padding: 12px;
        border-radius: 12px;
        background: rgba(13, 16, 27, 0.8);
        border: 1px solid rgba(77, 212, 255, 0.06);
      }

      #transcript li .role {
        display: block;
        font-size: 0.72rem;
        opacity: 0.6;
        text-transform: uppercase;
        margin-bottom: 6px;
        letter-spacing: 1px;
      }

      #status {
        font-size: 0.95rem;
        line-height: 1.5;
        white-space: pre-line;
      }

      form {
        display: flex;
        gap: 12px;
        margin-top: 16px;
      }

      input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border-radius: 999px;
        border: 1px solid rgba(77, 212, 255, 0.2);
        background: rgba(6, 8, 15, 0.7);
        color: inherit;
      }

      button {
        padding: 12px 24px;
        border-radius: 999px;
        border: none;
        background: linear-gradient(135deg, #4dd4ff, #3b8dff);
        color: #05060d;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 12px 24px rgba(61, 160, 255, 0.35);
      }

      footer {
        margin-top: auto;
        text-align: right;
        font-size: 0.75rem;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>JARVIS Control Surface</h1>
        <p id="connection">Connecting…</p>
      </div>
      <div class="orb"></div>
    </header>

    <main>
      <section class="panel">
        <h2>Conversation Feed</h2>
        <ul id="transcript"></ul>
      </section>

      <section class="panel">
        <h2>Active Window</h2>
        <div id="status">No window data yet.</div>
        <div id="system-status" style="margin-top: 16px; font-size: 0.9rem; opacity: 0.8;">
          System telemetry pending…
        </div>
        <div id="weather" style="margin-top: 16px; font-size: 0.9rem; opacity: 0.8;">
          Weather data not fetched yet.
        </div>
        <div id="alerts" style="margin-top: 16px; font-size: 0.85rem; color: #ffad66;"></div>
      </section>

      <section class="panel">
        <h2>Send Command</h2>
        <form id="manual-form">
          <input
            type="text"
            id="manual-input"
            placeholder="Type a manual instruction for the assistant"
            autocomplete="off"
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <footer>
      <span>Prototype Web UI &bull; Connects to ws://127.0.0.1:8800</span>
    </footer>

    <script>
      const transcriptEl = document.getElementById("transcript");
      const statusEl = document.getElementById("status");
      const connectionEl = document.getElementById("connection");
      const systemStatusEl = document.getElementById("system-status");
      const alertsEl = document.getElementById("alerts");
      const weatherEl = document.getElementById("weather");
      const manualForm = document.getElementById("manual-form");
      const manualInput = document.getElementById("manual-input");

      let socket;

      function appendMessage(role, text) {
        const li = document.createElement("li");
        const roleSpan = document.createElement("span");
        roleSpan.className = "role";
        roleSpan.textContent = role;
        li.appendChild(roleSpan);
        li.appendChild(document.createTextNode(text));
        transcriptEl.prepend(li);
      }

      function updateWindowInfo(payload) {
        const title = payload.title || (payload.window && payload.window.title);
        const className = payload.class_name || (payload.window && payload.window.class_name);
        if (!title && !className) {
          statusEl.textContent = "No active window information.";
          return;
        }
        statusEl.textContent = `Title: ${title || "Unknown"}\nClass: ${className || "Unknown"}`;
      }

      function updateSystemStatus(payload) {
        if (!payload || !payload.description) {
          systemStatusEl.textContent = "System telemetry unavailable.";
          return;
        }
        systemStatusEl.textContent = payload.description;
      }

      function pushAlert(message) {
        if (!message) return;
        const div = document.createElement("div");
        div.textContent = message;
        alertsEl.prepend(div);
        while (alertsEl.children.length > 4) {
          alertsEl.removeChild(alertsEl.lastChild);
        }
      }

      function connect() {
        socket = new WebSocket("ws://127.0.0.1:8800");

        socket.addEventListener("open", () => {
          connectionEl.textContent = "Connected";
          connectionEl.style.opacity = "0.6";
        });

        socket.addEventListener("message", (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data.type === "conversation") {
              appendMessage("Jarvis", data.payload.assistant || "");
              appendMessage("User", data.payload.user || "");
              updateWindowInfo(data.payload);
              if (data.payload.weather) {
                updateWeather(data.payload.weather);
              }
            } else if (data.type === "window_update") {
              updateWindowInfo(data.payload || {});
            } else if (data.type === "system_status") {
              updateSystemStatus(data.payload || {});
            } else if (data.type === "alert") {
              pushAlert(data.payload?.message);
            }
          } catch (error) {
            console.error("Invalid message received", error);
          }
        });

        socket.addEventListener("close", () => {
          connectionEl.textContent = "Disconnected. Retrying…";
          connectionEl.style.opacity = "1";
          setTimeout(connect, 3000);
        });

        socket.addEventListener("error", (error) => {
          console.error("WebSocket error", error);
          socket.close();
        });
      }

      manualForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (!manualInput.value.trim() || socket.readyState !== WebSocket.OPEN) {
          return;
        }
        socket.send(
          JSON.stringify({ type: "manual_command", payload: { text: manualInput.value } })
        );
        manualInput.value = "";
      });

      connect();
    </script>
  </body>
</html>
